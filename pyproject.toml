[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hikstatus"
version = "1.0.0"
description = "HikVision Monitoring & RTSP Status System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlmodel==0.0.24",
    "requests==2.32.3",
    "python-multipart==0.0.20",
    "jdatetime==5.2.0",
    "python-dotenv==1.1.0",
    "cryptography>=42.0.0",
    "loguru>=0.7.0",
    "pyotp==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0",
]

[tool.ruff]
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

ignore = [
    "DTZ",      # Timezone-naive datetimes
    "BLE",      # Blind exception catching
    "ASYNC",    # Async blocking operations
    "E501",     # Line too long
    "E711",     # Comparison to None
    "E712",     # Comparison to True
    "E402",     # Module-level imports not at top
    "E741",     # Ambiguous variable name
    "F841",     # Local variable assigned but unused
    "E722",     # Bare except
    "F821",     # Undefined name (e.g. sqlite3 in type hints)
    "F811",     # Redefinition of unused name
    "W293",     # Blank line contains whitespace
]
