<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="/manifest.json">
    <title>ورود — HikStatus</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <img src="/static/logo.webp" alt="لوگو" class="login-logo">
            <h1>HikStatus</h1>
            <p>سامانه مانیتورینگ دوربین‌ها</p>
        </div>

        <div class="login-card">
            <div class="error-msg" id="error-msg"></div>
            
            <!-- Standard Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" id="username" class="form-input" placeholder="نام کاربری" autocomplete="username"
                        required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور"
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="login-btn">
                    <span class="spinner"></span>
                    <span class="btn-text">ورود</span>
                </button>
            </form>

            <!-- 2FA Verification Form -->
            <form id="login-2fa-form" style="display: none;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(99, 102, 241, 0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; color: var(--primary);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">ورود دو مرحله‌ای</h3>
                    <p style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">کد ۶ رقمی تولید شده توسط اپلیکیشن Authenticator خود را وارد کنید.</p>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" style="text-align: center;">کد تایید دو مرحله‌ای</label>
                    <input type="text" id="2fa-code" class="form-input" placeholder="000000" style="text-align: center; letter-spacing: 6px; font-family: monospace; font-size: 20px; font-weight: bold; padding: 10px 12px;" maxlength="6" autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn-login" id="login-2fa-btn" style="margin-bottom: 12px;">
                    <span class="spinner"></span>
                    <span class="btn-text">تایید و ورود</span>
                </button>
                <button type="button" id="btn-cancel-2fa" class="btn-login" style="background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: normal;">
                    <span class="btn-text">بازگشت به صفحه ورود</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>طراحی و توسعه توسط تیم آی تی</p>
            <p style="margin-top: 4px; opacity: 0.7; font-size: 11px;">گروه صنعتی شیشه کاوه | شرکت اروم شیشه ساچی</p>
            <p style="margin-top: 4px; opacity: 0.7; font-size: 11px;">افشین نجاری و مهدی چمنی</p>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>

</html>
