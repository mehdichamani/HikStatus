<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="/manifest.json">
    <title>ورود — HikStatus</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-2: #1a1a24;
            --border: #2a2a36;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --text: #f1f5f9;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 256px;
            height: 256px;
            border-radius: 32px;
            margin: 0 auto 16px;
            display: block;
            object-fit: contain;
            background: var(--surface);
            padding: 16px;
        }

        .login-brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-brand p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
            direction: ltr;
            text-align: left;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <img src="/static/logo.webp" alt="لوگو" class="login-logo">
            <h1>HikStatus</h1>
            <p>سامانه مانیتورینگ دوربین‌ها</p>
        </div>

        <div class="login-card">
            <div class="error-msg" id="error-msg"></div>
            
            <!-- Standard Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" id="username" class="form-input" placeholder="نام کاربری" autocomplete="username"
                        required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور"
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="login-btn">
                    <span class="spinner"></span>
                    <span class="btn-text">ورود</span>
                </button>
            </form>

            <!-- 2FA Verification Form -->
            <form id="login-2fa-form" onsubmit="handle2FALogin(event)" style="display: none;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(99, 102, 241, 0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; color: var(--primary);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">ورود دو مرحله‌ای</h3>
                    <p style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">کد ۶ رقمی تولید شده توسط اپلیکیشن Authenticator خود را وارد کنید.</p>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" style="text-align: center;">کد تایید دو مرحله‌ای</label>
                    <input type="text" id="2fa-code" class="form-input" placeholder="000000" style="text-align: center; letter-spacing: 6px; font-family: monospace; font-size: 20px; font-weight: bold; padding: 10px 12px;" maxlength="6" autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn-login" id="login-2fa-btn" style="margin-bottom: 12px;">
                    <span class="spinner"></span>
                    <span class="btn-text">تایید و ورود</span>
                </button>
                <button type="button" class="btn-login" style="background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: normal;" onclick="cancel2FALogin()">
                    <span class="btn-text">بازگشت به صفحه ورود</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>طراحی و توسعه توسط تیم آی تی</p>
            <p style="margin-top: 4px; opacity: 0.7; font-size: 11px;">گروه صنعتی شیشه کاوه | شرکت اروم شیشه ساچی</p>
            <p style="margin-top: 4px; opacity: 0.7; font-size: 11px;">افشین نجاری و مهدی چمنی</p>
        </div>
    </div>

    <script>
        let tempToken = '';

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-msg');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            errorMsg.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;
            let redirecting = false;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    
                    if (data.status === "2fa_required") {
                        tempToken = data.temp_token;
                        document.getElementById('login-form').style.display = 'none';
                        document.getElementById('login-2fa-form').style.display = 'block';
                        const codeField = document.getElementById('2fa-code');
                        codeField.value = '';
                        codeField.focus();
                        return;
                    }

                    localStorage.setItem('user_role', data.role);
                    if (data.group_id) {
                        localStorage.setItem('user_group_id', data.group_id);
                    } else {
                        localStorage.removeItem('user_group_id');
                    }
                    if (data.password_is_plain) {
                        localStorage.setItem('admin_plain_password', '1');
                    } else {
                        localStorage.removeItem('admin_plain_password');
                    }
                    redirecting = true;
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.detail || 'نام کاربری یا رمز عبور اشتباه است';
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                errorMsg.textContent = 'خطا در اتصال به سرور';
                errorMsg.classList.add('show');
            } finally {
                if (!redirecting) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            }
        }

        async function handle2FALogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-2fa-btn');
            const errorMsg = document.getElementById('error-msg');
            const code = document.getElementById('2fa-code').value.trim();

            if (code.length !== 6 || isNaN(code)) {
                errorMsg.textContent = 'لطفاً کد ۶ رقمی را به‌طور صحیح وارد کنید';
                errorMsg.classList.add('show');
                return;
            }

            errorMsg.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;
            let redirecting = false;

            try {
                const res = await fetch('/api/auth/login/2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ temp_token: tempToken, code })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('user_role', data.role);
                    if (data.group_id) {
                        localStorage.setItem('user_group_id', data.group_id);
                    } else {
                        localStorage.removeItem('user_group_id');
                    }
                    if (data.password_is_plain) {
                        localStorage.setItem('admin_plain_password', '1');
                    } else {
                        localStorage.removeItem('admin_plain_password');
                    }
                    redirecting = true;
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.detail || 'کد وارد شده صحیح نیست یا منقضی شده است';
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                errorMsg.textContent = 'خطا در اتصال به سرور';
                errorMsg.classList.add('show');
            } finally {
                if (!redirecting) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            }
        }

        function cancel2FALogin() {
            tempToken = '';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('login-2fa-form').style.display = 'none';
            document.getElementById('error-msg').classList.remove('show');
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
</body>

</html>
