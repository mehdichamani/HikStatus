services:
  hikstatus:
    build: .
    container_name: hikstatus
    restart: always
    network_mode: host
    #ports:
    #  - '28888:28888'    
    environment:
      - TZ=Asia/Tehran
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
    volumes:
      - ./data:/app/data
      - ./camera_names.csv:/app/camera_names.csv

