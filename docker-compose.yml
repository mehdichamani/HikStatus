services:
  hikstatus:
    build: .
    container_name: hikstatus
    restart: always
    ports:
      - '28888:28888'
    environment:
      - TZ=Asia/Tehran
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
    volumes:
      - ./data:/app/data

networks:
  default:
    name: vpn
    external: true