services:
  hikstatus:
    build: .
    container_name: hikstatus
    restart: always
    ports:
      - '28888:28888'
    environment:
      - TZ=Asia/Tehran
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:28888/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# شبکه پیش‌فرض داکر. در صورت عدم نیاز به شبکه خارجی vpn، کل بخش زیر را کامنت یا حذف کنید تا شبکه پیش‌فرض (bridge) استفاده شود.
# Optional external network. Comment out or delete this block to use the default bridge network.
networks:
  default:
    name: vpn
    external: true
