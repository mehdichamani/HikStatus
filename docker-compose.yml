services:
  hikstatus:
    build: .
    container_name: hikstatus
    restart: always
    ports:
      - "${PORT:-28888}:${PORT:-28888}"
    environment:
      - TZ=Asia/Tehran
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - PORT=${PORT:-28888}
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port=os.getenv('PORT','28888'); urllib.request.urlopen(f'http://localhost:{port}/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  hikstatus_scheduler:
    build: .
    container_name: hikstatus_scheduler
    restart: always
    environment:
      - TZ=Asia/Tehran
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    command: python scheduler_runner.py
    depends_on:
      - hikstatus

# شبکه پیش‌فرض داکر. در صورت عدم نیاز به شبکه خارجی vpn، کل بخش زیر را کامنت یا حذف کنید تا شبکه پیش‌فرض (bridge) استفاده شود.
# Optional external network. Comment out or delete this block to use the default bridge network.
networks:
  default:
    name: vpn
    external: true
