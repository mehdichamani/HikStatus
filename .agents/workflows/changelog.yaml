name: "گردش کار به‌روزرسانی چنج‌لاگ"
description: "فرآیند سیستماتیک برای ثبت و دسته‌بندی تغییرات در فایل چنج‌لاگ پروژه پیش از نهایی‌سازی تغییرات. تمامی تغییرات مهم پروژه باید در انتهای هر Plan همراه با همان تک‌کامیت اصلی ثبت شوند."
changelog_file: "docs/CHANGELOG.md"
categories:
  - name: "🚀 قابلیت‌های جدید (Added)"
    description: "افزودن امکانات و ویژگی‌های جدید."
  - name: "🛠 اصلاحات (Fixed)"
    description: "رفع باگ‌ها و خطاهای سیستم."
  - name: "🔄 تغییرات و بهینه‌سازی (Changed)"
    description: "تغییر در عملکرد یا بهینه‌سازی کد."
  - name: "🗑 حذف شده (Removed)"
    description: "قابلیت‌ها یا فایل‌های حذف‌شده."
  - name: "⚠️ تغییرات ساختاری (Breaking Changes)"
    description: "تغییرات نیازمند اصلاح کانفیگ یا بازنویسی بخش‌های دیگر."

rules:
  - "تغییرات بدون نسخه باید در بخش `[Unreleased]` قرار گیرند."
  - "تمامی تاریخ‌ها در چنج‌لاگ باید به صورت شمسی (YYYY/MM/DD) ثبت شوند."
  - "توضیحات باید کاملاً به زبان فارسی روان نوشته شوند."

steps:
  - step: 1
    name: "بررسی و استخراج تغییرات"
    action: "استفاده از ابزارهای گیت (مانند git diff یا git status) و بررسی لیست کارهای انجام‌شده جهت شناسایی فایل‌های تغییریافته."
  
  - step: 2
    name: "دسته‌بندی تغییرات"
    action: "طبقه‌بندی تغییرات شناسایی‌شده بر اساس دسته‌های تعریف شده در فیلد categories (مانند Added، Fixed، Changed، Removed، Breaking Changes)."

  - step: 3
    name: "نگارش توضیحات"
    action: "نوشتن توضیحات تغییرات به زبان فارسی روان و ارجاع به فایل‌های کلیدی تغییریافته."

  - step: 4
    name: "به‌روزرسانی فایل چنج‌لاگ"
    action: "درج اطلاعات تغییریافته در فایل چنج‌لاگ (docs/CHANGELOG.md) ذیل بخش ## [Unreleased] (یا نسخه جدید با تاریخ شمسی YYYY/MM/DD در صورت تعیین نسخه توسط کاربر)."

  - step: 5
    name: "بازبینی و آماده‌سازی برای کامیت"
    action: "بررسی مجدد ساختار چنج‌لاگ و استیج کردن آن همراه با کدهای مرتبط در قالب یک تک‌کامیت نهایی (مگر اینکه کاربر مستقیماً دستور عدم کامیت داده باشد)."
